# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Tarkis ADM Site — Produção VPS
# Segurança: TLS 1.2/1.3, HSTS, CSP, rate limiting, gzip
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    # ── Básico ─────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main buffer=16k;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;   # Oculta versão do nginx

    # ── Tamanho de upload / timeouts ───────────────────
    client_max_body_size    10m;
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    # ── Gzip ───────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/xml+rss
        application/atom+xml image/svg+xml
        font/ttf font/otf font/woff font/woff2;

    # ── Rate limiting zones ────────────────────────────
    limit_req_zone  $binary_remote_addr zone=site:10m      rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m       rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Real IP (Cloudflare ou proxy reverso) ──────────
    # set_real_ip_from 103.21.244.0/22;   # descomente se usar Cloudflare
    real_ip_header   X-Forwarded-For;

    # ── Mapa de bots maliciosos ────────────────────────
    map $http_user_agent $bad_bot {
        default             0;
        "~*masscan"         1;
        "~*zgrab"           1;
        "~*nikto"           1;
        "~*sqlmap"          1;
        "~*wget"            1;
        "~*curl/7.2"        1;
    }

    # ── Redirect HTTP → HTTPS ─────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name tarkis.com.br www.tarkis.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://tarkis.com.br$request_uri;
        }
    }

    # ── Redirect www → apex ────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.tarkis.com.br;

        ssl_certificate     /etc/letsencrypt/live/tarkis.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tarkis.com.br/privkey.pem;

        return 301 https://tarkis.com.br$request_uri;
    }

    # ── Servidor principal ─────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tarkis.com.br;

        root  /var/www/tarkis/dist;
        index index.html;

        # ── TLS ──────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/tarkis.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tarkis.com.br/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;
        resolver                  1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout          5s;

        # ── Bloquear bots maliciosos ─────────────────
        if ($bad_bot) { return 403; }

        # ── Rate limiting ────────────────────────────
        limit_req  zone=site burst=60 nodelay;
        limit_conn addr 20;

        # ── Security headers ─────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header X-Frame-Options           "DENY"                                           always;
        add_header X-XSS-Protection          "1; mode=block"                                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # Content Security Policy
        add_header Content-Security-Policy
            "default-src 'self';
             script-src  'self' 'unsafe-inline' https://fonts.googleapis.com;
             style-src   'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
             font-src    'self' https://fonts.gstatic.com data:;
             img-src     'self' data: https:;
             connect-src 'self';
             frame-src   'none';
             object-src  'none';
             base-uri    'self';
             form-action 'self';
             upgrade-insecure-requests;"
            always;

        # ── Assets estáticos (cache longo) ───────────
        location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header Vary          "Accept-Encoding";
            access_log off;
        }

        # ── SPA / Astro static fallback ───────────────
        location / {
            try_files $uri $uri/ $uri.html /index.html;

            # HTML: no-cache
            location ~* \.html$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                expires    0;
            }
        }

        # ── Bloquear acesso a arquivos sensíveis ──────
        location ~ /\. {
            deny all;
            return 404;
        }
        location ~ \.(env|git|gitignore|DS_Store|htaccess|htpasswd)$ {
            deny all;
            return 404;
        }

        # ── Health check endpoint ─────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"tarkis-site"}';
            add_header Content-Type application/json;
        }

        # ── Erros personalizados ─────────────────────
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; internal; }
    }
}
